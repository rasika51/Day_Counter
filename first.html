<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Halves with CSS Grid</title>
    <link rel="stylesheet" href="first.css">


</head>
<body>
 
  <h1 class="main">New Year 2024</h1>
  <hr>
  <div class="container">

    <div class="count-e days-c">
      <p class="big-text" id="dayID">0</p>
      <br><span><b>Day</b></span>
    </div>

    <div class="count-e hours-c">
      <p class="big-text" id="hoursID">0</p>
      <br><span><b>Hour</b></span>
    </div>

    <div class="count-e minutes-c">
      <p class="big-text" id="minuteID">0</p>
      <br><span><b>Minute</b></span>
    </div>

    <div class="count-e second-c">
      <p class="big-text" id="secondID">0</p>
      <br><span><b>Second</b></span>
    </div>

  </div>

  <footer>I Love Coding...!!</footer>


  <script src="first.js"></script>
</body>
</html>
